name: CI

# Quality gates plus a cross-platform check. The test job mirrors the local
# certification gates (gofmt, vet, staticcheck, golangci-lint, tests with
# and without -race, binary smoke) so a green run means the tree is
# releasable. The vet job type-checks every supported target because Keen
# ships platform-specific terminal code (term_unix.go on Linux,
# term_other.go elsewhere) that the test runner never compiles; vet
# compiles each target as part of analysis, so no separate build step is
# needed. Linking stays covered by the test job's real binary build.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gates, tests & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Run staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run

      - name: Run tests without race detector
        run: go test -count=1 ./...

      - name: Run tests with race detector
        run: go test -count=1 -race ./...

      - name: Build binary
        run: go build -trimpath -o /tmp/keen ./cmd/keen

      - name: Smoke-test binary
        run: |
          /tmp/keen -version
          /tmp/keen --help >/dev/null

      - name: Check diff hygiene
        run: git diff --check

  vet:
    name: Vet ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [ linux, darwin, windows ]
        goarch: [ amd64, arm64 ]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet all packages
        run: go vet ./...
